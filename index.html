<!doctype html>
<html lang="sr">
<head>

<meta name="apple-mobile-web-app-title" content="Atmos Ishrana">
<style>
:root{--acc:#f0782f;--bg:#0c1512;--bg2:#111e1a;--card:#16251f;--card2:#1d3029;--line:rgba(255,255,255,.1);--txt:#eef7f3;--muted:#98b3a8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--p:#60a5fa;--c:#fbbf24;--f:#f472b6;--r:16px;--nav:64px}
:root[data-theme=light]{--bg:#f4f6f3;--bg2:#e9eee9;--card:#fff;--card2:#f1f4f0;--line:rgba(10,50,35,.12);--txt:#14231c;--muted:#5b6f66;--ok:#059669;--warn:#b45309;--bad:#dc2626;--p:#2563eb;--c:#d97706;--f:#db2777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-size:.9rem}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-d{background:rgba(248,113,113,.15);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-s{padding:6px 10px;font-size:.8rem;border-radius:10px}
.btn-g{background:none;border-color:transparent;color:var(--muted)}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
select.fld option{color:#000}
label.l{display:block;font-size:.72rem;color:var(--muted);margin:0 0 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;letter-spacing:.5px;font-size:1rem;white-space:nowrap;flex:1}.logo b{color:var(--acc)}
.logo img{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:6px}
.shell{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.8rem}.xs{font-size:.72rem}.b{font-weight:700}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat small{color:var(--muted);font-size:.7rem;display:block}.stat b{font-size:1.05rem;display:block;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:20px 10px;font-size:.9rem}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.pnav .lbl{flex:1;text-align:center;font-weight:700;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pnav button{min-width:46px}
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font-size:1.7rem;line-height:1.1}.ring .in small{color:var(--muted);font-size:.72rem}
.hsum{flex:1;min-width:0;display:grid;gap:8px}
.hsum div{display:flex;justify-content:space-between;font-size:.88rem}
.mac{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac .t{font-size:.72rem;color:var(--muted)}.mac .t span{display:block}.mac .t span+span{color:var(--txt);font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px}
.meal h3 .k{font-weight:700;color:var(--muted);font-size:.85rem}
.ent{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}
.ent:first-of-type{border-top:0}
.ent .n{font-weight:600;font-size:.92rem;word-break:break-word}

.ent img,.fi img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--card2);flex:none}
.ent .ph,.fi .ph{width:38px;height:38px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.2rem}
.fi{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.fi .n{font-weight:600;font-size:.92rem;word-break:break-word}
.fi .k{font-weight:700;white-space:nowrap;text-align:right;font-size:.9rem}
.sec{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 2px 6px}
.ns{display:inline-block;width:18px;height:18px;border-radius:5px;color:#fff;font-weight:800;font-size:.7rem;text-align:center;line-height:18px;margin-left:4px;vertical-align:middle}
.ns-a{background:#038141}.ns-b{background:#85bb2f}.ns-c{background:#fecb02;color:#000}.ns-d{background:#ee8100}.ns-e{background:#e63e11}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:.68rem;font-weight:700;background:var(--card2);color:var(--muted);vertical-align:middle}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.83rem}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:7px 11px;font-size:.82rem;border-radius:999px}
.water{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}.water span{font-size:1.25rem;opacity:.25}.water span.on{opacity:1}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{max-width:900px;margin:auto;display:flex;height:var(--nav)}
nav.bot button{flex:1;border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;color:var(--muted);padding:4px}
nav.bot button span{font-size:1.3rem}
nav.bot button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:10px}
.fab button{width:56px;height:56px;border-radius:50%;font-size:1.5rem;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}.fab button.pill{width:auto;border-radius:28px;padding:0 18px;font-size:1rem;font-weight:600;background:var(--card);border:1px solid var(--acc)}
dialog{border:0;padding:0;background:var(--bg);color:var(--txt);width:100%;max-width:640px;max-height:100%;height:100%;margin:auto}
@media(min-width:700px){dialog{height:auto;max-height:92vh;border-radius:18px;border:1px solid var(--line)}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.dh h2{flex:1;margin:0;font-size:1.02rem}
.db{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.nut{width:100%;border-collapse:collapse;font-size:.86rem}.nut td{padding:6px 2px;border-bottom:1px solid var(--line)}.nut td:last-child{text-align:right;font-weight:600}
.big{font-size:2rem;font-weight:800}
.chart{display:flex;gap:4px;align-items:flex-end;height:150px;position:relative;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .col i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--acc);display:block;min-height:2px}
.chart .col i.over{background:var(--bad)}.chart .col i.no{background:var(--card2)}
.chart .col small{font-size:.58rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);opacity:.7;pointer-events:none}
#scanv{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
.scanbox{position:relative}
.scanbox .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:3px solid var(--acc);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.25);pointer-events:none}
.scanbox .ln{position:absolute;left:14%;right:14%;top:50%;height:2px;background:var(--bad);opacity:.8;animation:sl 1.6s ease-in-out infinite;pointer-events:none}
@keyframes sl{0%,100%{transform:translateY(-22px)}50%{transform:translateY(22px)}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.warnb{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:10px;font-size:.85rem;margin-bottom:10px}
.okb{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);border-radius:12px;padding:10px;font-size:.85rem;margin-bottom:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}.sw button.on{border-color:var(--txt)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
.coffee-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}.coffee-ov.open{display:flex}
.coffee-box{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;max-width:380px;width:100%;max-height:92vh;overflow:auto;padding:22px;text-align:center;font-size:.92rem;line-height:1.5;position:relative}
.coffee-box h3{margin:0 0 10px;font-size:1.1rem;display:block}.coffee-box p{margin:8px 0}
.coffee-acc{display:inline-block;margin:6px 0;padding:6px 12px;border-radius:10px;background:var(--card2);font-variant-numeric:tabular-nums;letter-spacing:.5px;user-select:all}
.coffee-qr{width:200px;height:200px;margin:12px auto 4px;background:#fff;border-radius:10px;padding:6px}
.coffee-x{position:absolute;top:6px;right:10px;width:auto;background:none;border:0;color:var(--txt);font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 8px}
.coffee-amts{display:flex;gap:6px;justify-content:center;margin-top:12px}.coffee-amts button{width:auto;padding:6px 12px;border-radius:10px;border:1px solid rgba(128,128,128,.45);background:rgba(128,128,128,.15);color:inherit;font:inherit;font-size:.85em;cursor:pointer}.coffee-amts button.on{background:var(--acc);border-color:var(--acc);color:#fff}.coffee-qrv svg{width:100%;height:100%;display:block}.coffee-qrv[hidden]{display:none}
.coffee-mini{display:inline-block;width:auto;margin-top:8px;padding:5px 12px;font-size:.75rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}.clk{cursor:pointer}.clk:active{opacity:.85}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:10px}
a{color:var(--acc)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><img src="icon-192.png" alt="">Atmos <b>Ishrana</b></div>
  <span id="gdst" class="small muted"></span>
</div></header>
<main class="shell" id="app"></main>
<div class="fab" id="fab"></div>
<nav class="bot"><div class="in" id="nav"></div></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="imgIn" accept="image/*" capture="environment" hidden>
<input type="file" id="ocrIn" accept="image/*" capture="environment" hidden><input type="file" id="ocrInG" accept="image/*" hidden>
<div id="toast"></div>
<script src="foods.js"></script>
<script>
'use strict';
const VER='1.2',KEY='atmosIshrana1';
const MEALS=[['b','Doručak','🌅'],['l','Ručak','🍲'],['d','Večera','🌙'],['s','Užine','🍎']];
const MEAL=Object.fromEntries(MEALS.map(m=>[m[0],m]));
const MACC={b:'doručak',l:'ručak',d:'večeru',s:'užine'};
const NK=['kcal','p','c','f','fib','sug','sat','salt'];
const NL={kcal:'Energija',p:'Proteini',c:'Ugljeni hidrati',f:'Masti',fib:'Vlakna',sug:'od toga šećeri',sat:'od toga zasićene',salt:'So'};
const ACT=[[1.2,'Sedentarno (malo ili bez kretanja)'],[1.375,'Lagana aktivnost (1–3 dana nedeljno)'],[1.55,'Umerena aktivnost (3–5 dana)'],[1.725,'Visoka aktivnost (6–7 dana)'],[1.9,'Vrlo visoka (fizički posao + trening)']];
const ACCENTS=['#f0782f','#0f9d78','#3b82f6','#8b5cf6','#e11d48','#eab308'];
const OFF='https://world.openfoodfacts.org';
const OFF_F='code,product_name,product_name_sr,generic_name,brands,quantity,serving_quantity,nutriments,image_front_small_url,nutriscore_grade';

/* ---------- pomoćne ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const DAYS=['ned','pon','uto','sre','čet','pet','sub'];
const MONS=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
function dlabel(s){const t=today();if(s===t)return'Danas';if(s===addDays(t,-1))return'Juče';if(s===addDays(t,1))return'Sutra';const d=new Date(s+'T12:00:00');return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
const r0=x=>Math.round(Number(x)||0);
const r1=x=>{const v=Math.round((Number(x)||0)*10)/10;return String(v).replace('.',',')};
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s','ќ':'c','ѓ':'dj','ѕ':'dz','й':'j','ы':'y','э':'e','ю':'ju','я':'ja','щ':'s','ъ':'','ь':'','ё':'e','є':'e','і':'i','ї':'i'};
const norm=s=>String(s||'').toLowerCase().replace(/[а-џ]/g,c=>CYR[c]??c).replace(/đ/g,'dj').normalize('NFD').replace(/[̀-ͯ]/g,'');
/* dugme „nazad“ (Android) zatvara otvoreni prozor umesto da izađe iz aplikacije */
let dDepth=0,dPend=0,dIgnore=0,dSkip=0;
function openD(d){if(d.open)return;d.showModal();dDepth++;try{history.pushState({atmosDlg:dDepth},'')}catch{}}
function onDClose(){if(dSkip){dSkip--;return}if(dDepth>0){dDepth--;dPend++;clearTimeout(onDClose.t);onDClose.t=setTimeout(()=>{const n=dPend;dPend=0;if(n){dIgnore++;history.go(-n)}},0)}}
addEventListener('popstate',()=>{if(dIgnore){dIgnore--;return}const a=document.getElementById('dlg2'),b=document.getElementById('dlg'),top=a.open?a:b.open?b:null;
  if(top){dDepth=Math.max(0,dDepth-1);dSkip++;if(top===a)stopScan();top.close()}});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- podaci ---------- */
const COLLS=['entries','foods','weights','water','recipes','templates','activities'];
function freshProfile(){return{set:false,sex:'m',age:30,height:175,weight:75,goalW:null,act:1.375,goal:'keep',rate:0.5,kcal:0,mp:25,mc:45,mf:30,water:2000,actAdd:true,fastOn:false,fastH:16,fastStart:null}}
function fresh(){return{v:1,profile:freshProfile(),entries:[],foods:[],weights:[],water:[],recipes:[],templates:[],activities:[],settings:{theme:'dark',accent:ACCENTS[0]}}}
function normDb(x){const f=fresh();x=x&&typeof x==='object'?x:{};
  const o={v:1,profile:Object.assign(freshProfile(),x.profile||{}),settings:Object.assign(f.settings,x.settings||{})};
  COLLS.forEach(k=>o[k]=Array.isArray(x[k])?x[k].filter(r=>r&&r.id):[]);o._mt=x._mt&&typeof x._mt==='object'?x._mt:{};o._lh=x._lh&&typeof x._lh==='object'?x._lh:{};return o}
let db=(()=>{try{return normDb(JSON.parse(localStorage.getItem(KEY)))}catch{return fresh()}})();
function markMt(){if(!db._mt)db._mt={};if(!db._lh)db._lh={};const s=gdSingles();
  for(const k in s){if(!s[k])continue;const h=gdHash(s[k]);if(db._lh[k]!==h){if(db._lh[k]!==undefined)db._mt[k]=Date.now();db._lh[k]=h}}}
function save(){markMt();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('⚠ Memorija uređaja je puna')}gdSoon()}
const S=()=>db.settings,P=()=>db.profile;
const hasData=()=>COLLS.some(k=>db[k].length);
function saveLocal(){markMt();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}

/* ---------- ciljevi ---------- */
function calc(){const p=P(),kg=Number(p.weight)||70,cm=Number(p.height)||170,age=Number(p.age)||30;
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='f'?-161:5),tdee=bmr*(Number(p.act)||1.2);
  const d=p.goal==='lose'?-p.rate*7700/7:p.goal==='gain'?p.rate*7700/7:0;
  const floor=p.sex==='f'?1200:1500;let auto=Math.round((tdee+d)/10)*10,low=false;
  if(auto<floor){auto=floor;low=true}
  const kcal=Number(p.kcal)>0?Number(p.kcal):auto;
  const g={kcal,p:kcal*p.mp/100/4,c:kcal*p.mc/100/4,f:kcal*p.mf/100/9,water:Number(p.water)||2000};
  const bmi=kg/((cm/100)**2);
  return{bmr,tdee,auto,low,g,bmi,floor}}

/* ---------- namirnice ---------- */
const BASE=BASE_FOODS.map((a,i)=>({id:'b'+i,name:a[0],src:'base',cat:a[6],per:{kcal:a[1],p:a[2],c:a[3],f:a[4],fib:a[5]},pc:a[7]?{g:a[7],l:a[8]}:null,_n:norm(a[0])}));
const fkey=f=>f.rid?'r:'+f.rid:f.code?'c:'+f.code:'n:'+norm(f.name)+'|'+norm(f.brand);
function entTot(e,k){return(Number(e.per&&e.per[k])||0)*(Number(e.g)||0)/100}
function dayEntries(d){return db.entries.filter(e=>e.date===d)}
function sumOf(list){const t={};NK.forEach(k=>t[k]=0);list.forEach(e=>NK.forEach(k=>t[k]+=entTot(e,k)));return t}
function foodFromEntry(e){return{rid:e.fid&&String(e.fid).startsWith('rc:')?e.fid.slice(3):undefined,id:e.fid||'',name:e.name,brand:e.brand,code:e.code,per:e.per,pc:e.pc,serving:e.serving,img:e.img,ns:e.ns,src:e.src||'user',quick:e.quick}}
function findFood(id){if(String(id).startsWith('rc:')){const r=db.recipes.find(x=>x.id===id.slice(3));return r&&recipeFood(r)}return db.foods.find(f=>f.id===id)||BASE.find(f=>f.id===id)}
function recTot(r){const t={};NK.forEach(k=>t[k]=0);let w=0;(r.items||[]).forEach(i=>{w+=Number(i.g)||0;NK.forEach(k=>t[k]+=entTot(i,k))});return{t,w}}
function recipeFood(r){const{t,w}=recTot(r),wt=Number(r.cooked)>0?Number(r.cooked):w,per={};NK.forEach(k=>per[k]=wt?Math.round(t[k]/wt*1000)/10:0);
  const sv=Math.max(1,Number(r.servings)||1);return{id:'rc:'+r.id,rid:r.id,name:r.name,per,pc:{g:Math.max(1,Math.round(wt/sv)),l:'porcija'},src:'recipe',fav:!!r.fav,brand:''}}
function upsertFood(f){const k=fkey(f),i=db.foods.findIndex(x=>(f.id&&x.id===f.id)||fkey(x)===k);
  const rec=Object.assign({},i>=0?db.foods[i]:{},f);delete rec._n;delete rec._g;delete rec.nokcal;
  rec.id=i>=0?db.foods[i].id:(f.id&&!/^(b\d|off:|r\d)/.test(f.id)?f.id:uid());
  if(i>=0)db.foods[i]=rec;else db.foods.push(rec);return rec}
function recentFoods(n){const seen=new Set(),out=[];[...db.entries].sort((a,b)=>(b.t||0)-(a.t||0)).forEach(e=>{if(e.quick)return;let f=foodFromEntry(e);const k=fkey(f);if(seen.has(k))return;seen.add(k);if(f.rid){const r=db.recipes.find(x=>x.id===f.rid);if(!r)return;f=recipeFood(r)}out.push(Object.assign(f,{_g:e.g}))});return out.slice(0,n)}
function isFav(f){if(f.rid){const r=db.recipes.find(x=>x.id===f.rid);return!!(r&&r.fav)}const k=fkey(f);return db.foods.some(x=>x.fav&&fkey(x)===k)}

function ringSvg(v,max,col){const R=64,C=2*Math.PI*R,p=Math.min(1,max?v/max:0);return`<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--card2)" stroke-width="13"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}
function macBar(lbl,v,g,col){const p=g?Math.min(100,v/g*100):0;return`<div><div class="t"><span>${lbl}</span><span>${r0(v)} / ${r0(g)} g</span></div><div class="bar"><i style="width:${p}%;background:${col}"></i></div></div>`}
function rDiary(){
  const d=ui.date,es=dayEntries(d),t=sumOf(es),c=calc(),acts=db.activities.filter(a=>a.date===d),actK=acts.reduce((s,a)=>s+(Number(a.kcal)||0),0);
  const bonus=P().actAdd?actK:0,sc=c.g.kcal?(c.g.kcal+bonus)/c.g.kcal:1,g=Object.assign({},c.g,{kcal:c.g.kcal+bonus,p:c.g.p*sc,c:c.g.c*sc,f:c.g.f*sc}),left=g.kcal-t.kcal,over=left<0;
  const w=db.water.find(x=>x.id===d),ml=w?w.ml:0,gl=Math.max(1,Math.round(g.water/250));
  let h=`<div class="pnav"><button data-act="day" data-v="-1">‹</button><div class="lbl" data-act="day" data-v="0">${dlabel(d)}</div><button data-act="day" data-v="1">›</button></div>`;
  h+=instBanner();
  if(!P().set)h+=`<div class="warnb">👋 Dobro došao! <b>Podesi svoj profil</b> (pol, godine, visina, težina, cilj) da izračunam koliko kalorija ti je potrebno dnevno.<div style="margin-top:8px"><button class="btn-p btn-s" data-act="tab" data-v="podesavanja">Podesi profil</button></div></div>`;
  h+=`<div class="card"><div class="hero"><div class="ring">${ringSvg(t.kcal,g.kcal,over?'var(--bad)':'var(--acc)')}<div class="in"><b>${r0(Math.abs(left))}</b><small>${over?'kcal preko cilja':'kcal preostalo'}</small></div></div>
    <div class="hsum"><div><span class="muted">Cilj</span><b>${r0(g.kcal)} kcal</b></div>${bonus?`<div class="xs"><span class="muted">🏃 aktivnost</span><span style="color:var(--ok)">+${r0(bonus)}</span></div>`:''}<div><span class="muted">Uneto</span><b>${r0(t.kcal)} kcal</b></div><div><span class="muted">Vlakna</span><span>${r1(t.fib)} g</span></div><div><span class="muted">Šećeri</span><span>${r1(t.sug)} g</span></div><div><span class="muted">So</span><span>${r1(t.salt)} g</span></div></div></div>
    <div class="mac">${macBar('Proteini',t.p,g.p,'var(--p)')}${macBar('Ugljeni hidr.',t.c,g.c,'var(--c)')}${macBar('Masti',t.f,g.f,'var(--f)')}</div></div>`;
  if(P().fastOn)h+=`<div class="card" id="fastbox">${fastHtml()}</div>`;
  if(!es.length){const y=dayEntries(addDays(d,-1));if(y.length)h+=`<button style="width:100%;margin-bottom:12px" data-act="copyday">↻ Ponovi ceo jučerašnji dan (${y.length} stavki · ${r0(sumOf(y).kcal)} kcal)</button>`}
  MEALS.forEach(([m,n,ic])=>{const me=es.filter(e=>e.meal===m),mk=me.reduce((s,e)=>s+entTot(e,'kcal'),0);
    const y=!me.length&&db.entries.some(e=>e.date===addDays(d,-1)&&e.meal===m);
    h+=`<div class="card meal"><h3><span>${ic} ${n}</span><span class="k">${me.length?r0(mk)+' kcal':''}</span></h3>`;
    h+=me.map(e=>`<div class="ent" data-act="edit" data-v="${e.id}">${e.img?`<img src="${esc(e.img)}" alt="" loading="lazy">`:`<div class="ph">${e.quick?'⚡':String(e.fid||'').startsWith('rc:')?'📖':'🍽️'}</div>`}<div class="grow"><div class="n">${esc(e.name)}</div><div class="xs muted">${e.quick?'brzi unos':esc(gramLbl(e))}${e.brand?' · '+esc(e.brand):''} · P ${r0(entTot(e,'p'))} · UH ${r0(entTot(e,'c'))} · M ${r0(entTot(e,'f'))}</div></div><div class="k">${r0(entTot(e,'kcal'))}</div></div>`).join('');
    h+=`<div class="row wrap" style="margin-top:${me.length?8:0}px"><button class="btn-s" data-act="add" data-v="${m}">＋ Dodaj</button>${y?`<button class="btn-s btn-g" data-act="copyy" data-v="${m}">↻ Kao juče</button>`:''}${me.length?`<button class="btn-s btn-g" data-act="tplsave" data-v="${m}">📋 Sačuvaj kao šablon</button>`:''}</div></div>`});
  h+=`<div class="card"><h3><span>🏃 Aktivnost</span><span class="k">${actK?r0(actK)+' kcal':''}</span></h3>${acts.map(a=>`<div class="ent" data-act="actedit" data-v="${a.id}"><div class="ph">🏃</div><div class="grow"><div class="n">${esc(a.name)}</div><div class="xs muted">${a.min?r0(a.min)+' min':''}</div></div><div class="k" style="color:var(--ok)">−${r0(a.kcal)}</div></div>`).join('')}
    <div class="row" style="margin-top:${acts.length?8:0}px"><button class="btn-s" data-act="actadd">＋ Dodaj aktivnost</button></div></div>`;
  h+=`<div class="card"><h3><span>💧 Voda</span><span class="k">${(ml/1000).toFixed(2).replace('.',',')} / ${(g.water/1000).toFixed(1).replace('.',',')} l</span></h3>
    <div class="water">${Array.from({length:gl},(_,i)=>`<span class="${i<Math.round(ml/250)?'on':''}">💧</span>`).join('')}</div>
    <div class="chips"><button data-act="water" data-v="250">＋ čaša 250 ml</button><button data-act="water" data-v="500">＋ 500 ml</button><button data-act="water" data-v="-250">− 250</button></div></div>`;
  return h}
function gramLbl(e){if(e.pc&&e.pc.g){const n=e.g/e.pc.g;if(Math.abs(n-Math.round(n))<0.01&&n>=1)return Math.round(n)+' × '+e.pc.l+' ('+r0(e.g)+' g)'}return r0(e.g)+' g'}

let fq='',fcat='moje';
function rFoods(){
  let h=`<div class="card"><input class="fld" id="fq" placeholder="Pretraži tablicu i svoje namirnice…" value="${esc(fq)}" data-in="fq"><div class="seg" style="margin-top:10px">${[['moje','Moje'],['fav','⭐'],['rec','📖 Recepti'],['tab','Tablica']].map(x=>`<button data-act="fcat" data-v="${x[0]}" class="${fcat===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="grow" data-act="newfood">✏️ Nova namirnica</button><button class="grow" data-act="scanfood">📷 Skeniraj</button></div></div><div id="flist">${foodsList()}</div>`;

function foodsList(){const q=norm(fq);let list;
  if(fcat==='rec'){const rs=db.recipes.filter(r=>!q||norm(r.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'sr'));

  list=db.foods.filter(f=>(fcat==='fav'?f.fav:true)&&(!q||norm(f.name+' '+(f.brand||'')+' '+(f.code||'')).includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'sr'));
  if(!list.length)return`<div class="empty">${fcat==='fav'?'Nema omiljenih. Otvori namirnicu i dodirni ☆ da je dodaš.':'Ovde se čuvaju namirnice koje sam upišeš i proizvodi koje skeniraš ili nađeš na internetu.'}</div>`;

function fItem(f,act,extra){const k=f.per&&f.per.kcal!=null?r0(f.per.kcal):'?';

/* ---------- NAPREDAK ---------- */
function rProgress(){const c=calc(),n=ui.prog,t=today();
  const days=Array.from({length:n},(_,i)=>addDays(t,i-n+1)).map(d=>({d,s:sumOf(dayEntries(d)),has:db.entries.some(e=>e.date===d)}));
  const logged=days.filter(x=>x.has),avg=k=>logged.length?logged.reduce((s,x)=>s+x.s[k],0)/logged.length:0;
  const mx=Math.max(c.g.kcal*1.2,...days.map(x=>x.s.kcal))||1;
  let h=`<div class="row" style="margin-bottom:12px"><div class="seg grow">${[[7,'7 dana'],[14,'14 dana'],[30,'30 dana']].map(x=>`<button data-act="prog" data-v="${x[0]}" class="${n===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><button data-act="share" title="Podeli izveštaj">📤</button></div>`;
  h+=`<div class="card"><h3>🔥 Kalorije po danima</h3><div class="chart"><div class="goal" style="bottom:${c.g.kcal/mx*150}px"></div>${days.map(x=>{const hh=x.s.kcal/mx*100,dd=new Date(x.d+'T12:00:00');return`<div class="col" title="${dlabel(x.d)}: ${r0(x.s.kcal)} kcal" data-act="goday" data-v="${x.d}"><i class="${!x.has?'no':x.s.kcal>c.g.kcal*1.05?'over':''}" style="height:${x.has?hh:1}%"></i><small>${n<=14?DAYS[dd.getDay()]:(dd.getDate()%5===0?dd.getDate():'')}</small></div>`}).join('')}</div>
    <div class="xs muted" style="margin-top:6px">Isprekidana linija = dnevni cilj (${r0(c.g.kcal)} kcal). Dodirni stub da otvoriš taj dan.</div>
    <div class="grid g3" style="margin-top:12px"><div class="stat"><small>Prosek</small><b>${r0(avg('kcal'))}</b><small>kcal/dan</small></div><div class="stat"><small>Upisanih dana</small><b>${logged.length}/${n}</b></div><div class="stat"><small>U okviru cilja</small><b>${logged.filter(x=>x.s.kcal<=c.g.kcal*1.05).length}</b><small>dana</small></div></div></div>`;
  const ap=avg('p'),ac=avg('c'),af=avg('f'),tk=ap*4+ac*4+af*9||1;
  h+=`<div class="card"><h3>🥩 Prosečni makronutrijenti</h3><div class="bar" style="height:14px;display:flex"><i style="width:${ap*4/tk*100}%;background:var(--p);border-radius:0"></i><i style="width:${ac*4/tk*100}%;background:var(--c);border-radius:0"></i><i style="width:${af*9/tk*100}%;background:var(--f);border-radius:0"></i></div>
    <div class="grid g3" style="margin-top:10px"><div class="stat"><small style="color:var(--p)">Proteini</small><b>${r0(ap)} g</b><small>${r0(ap*4/tk*100)}% · cilj ${P().mp}%</small></div><div class="stat"><small style="color:var(--c)">Ugljeni hidrati</small><b>${r0(ac)} g</b><small>${r0(ac*4/tk*100)}% · cilj ${P().mc}%</small></div><div class="stat"><small style="color:var(--f)">Masti</small><b>${r0(af)} g</b><small>${r0(af*9/tk*100)}% · cilj ${P().mf}%</small></div></div>
    <div class="grid g3" style="margin-top:10px"><div class="stat"><small>Vlakna</small><b>${r1(avg('fib'))} g</b></div><div class="stat"><small>Šećeri</small><b>${r1(avg('sug'))} g</b></div><div class="stat"><small>So</small><b>${r1(avg('salt'))} g</b></div></div></div>`;
  h+=weightCard(c);
  const top={};db.entries.filter(e=>e.date>=days[0].d).forEach(e=>{const k=e.name;top[k]=(top[k]||0)+entTot(e,'kcal')});
  const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(tl.length)h+=`<div class="card"><h3>🍽️ Najviše kalorija je došlo iz</h3>${tl.map(([n,k])=>`<div class="row sp small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><b>${r0(k)} kcal</b></div>`).join('')}</div>`;
  return h}
function weightCard(c){const ws=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));const last=ws[ws.length-1],first=ws[0];
  let h=`<div class="card"><h3><span>⚖️ Težina</span><button class="btn-s btn-p" data-act="addw">＋ Upiši</button></h3>`;
  if(ws.length>=2){const pts=ws.slice(-60),mn=Math.min(...pts.map(w=>w.kg),P().goalW||1e9)-1,mx=Math.max(...pts.map(w=>w.kg))+1,W=600,H=160;
    const x=i=>pts.length===1?W/2:i/(pts.length-1)*(W-20)+10,y=v=>H-10-(v-mn)/(mx-mn)*(H-20);
    h+=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${P().goalW?`<line x1="0" x2="${W}" y1="${y(P().goalW)}" y2="${y(P().goalW)}" stroke="var(--ok)" stroke-dasharray="6 6" stroke-width="2"/>`:''}<polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" points="${pts.map((w,i)=>x(i)+','+y(w.kg)).join(' ')}"/>${pts.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.kg)}" r="4" fill="var(--acc)"/>`).join('')}</svg>`}
  if(last)h+=`<div class="grid g3" style="margin-top:8px"><div class="stat"><small>Trenutno</small><b>${r1(last.kg)} kg</b></div><div class="stat"><small>Promena</small><b>${(last.kg-first.kg>0?'+':'')+r1(last.kg-first.kg)} kg</b></div><div class="stat"><small>BMI</small><b>${r1(c.bmi)}</b><small>${c.bmi<18.5?'pothranjenost':c.bmi<25?'normalno':c.bmi<30?'prekomerno':'gojaznost'}</small></div></div>`;
  else h+=`<div class="empty">Upiši težinu da pratiš napredak.</div>`;
  if(ws.length)h+=`<details style="margin-top:8px"><summary>Sva merenja (${ws.length})</summary>${[...ws].reverse().map(w=>`<div class="row sp small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${dlabel(w.date)}</span><span><b>${r1(w.kg)} kg</b> <button class="btn-s btn-g" data-act="delw" data-v="${w.id}">✕</button></span></div>`).join('')}</details>`;
  return h+'</div>'}

/* ---------- PODEŠAVANJA ---------- */

function pcalcHtml(){const p=P(),c=calc();return`<div class="grid g3" style="margin-top:12px"><div class="stat"><small>Bazalni metab.</small><b>${r0(c.bmr)}</b><small>kcal</small></div><div class="stat"><small>Potrošnja</small><b>${r0(c.tdee)}</b><small>kcal/dan</small></div><div class="stat" style="outline:2px solid var(--acc)"><small>Tvoj cilj</small><b>${r0(c.g.kcal)}</b><small>kcal/dan</small></div></div>
   ${c.low&&!(p.kcal>0)?`<div class="warnb" style="margin-top:10px">Izračunati cilj je bio ispod ${c.floor} kcal, pa je postavljen na ${c.floor} kcal. Za strože režime posavetuj se sa lekarom ili nutricionistom.</div>`:''}`}
function msumHtml(){const p=P(),c=calc(),s=p.mp+p.mc+p.mf;return`<div class="xs ${s===100?'muted':''}" style="margin-top:6px;${s!==100?'color:var(--bad)':''}">Zbir: ${s}% ${s!==100?'— treba da bude 100%':''} · P ${r0(c.g.p)} g · UH ${r0(c.g.c)} g · M ${r0(c.g.f)} g</div>`}

let add={meal:'b',q:'',online:null,busy:false,err:''};
function defMeal(){const h=new Date().getHours();return h<11?'b':h<16?'l':h<21?'d':'s'}
function openAdd(meal){add={meal:meal||defMeal(),q:'',online:null,busy:false,err:'',mode:'diary'};const d=$('#dlg');d.innerHTML=addHtml();openD(d);rAddList()}
function addHtml(){const rm=add.mode==='recipe';return`<div class="dh">${rm?`<button class="btn-s" data-act="recback">‹ Recept</button><h2>Dodaj sastojak</h2>`:`<button class="btn-s" data-act="close">✕</button><h2>Dodaj hranu <span class="muted small">· ${dlabel(ui.date)}</span></h2>`}</div><div class="db">
  ${rm?'':`<div class="seg" id="addmeal">${MEALS.map(m=>`<button data-act="ameal" data-v="${m[0]}" class="${add.meal===m[0]?'on':''}">${m[2]} ${m[1]}</button>`).join('')}</div>`}
  <form id="aform" class="row" style="margin-top:10px" onsubmit="return false"><input class="fld grow" id="aq" type="search" enterkeyhint="search" placeholder="Npr. jogurt, hleb, Plazma…" autocomplete="off" data-in="aq"><button class="btn-p" data-act="osearch" type="submit">🔍</button></form>
  <div class="row" style="margin-top:10px"><button class="grow" data-act="scan">📷 Skeniraj barkod</button>${rm?'':`<button class="grow" data-act="quick">⚡ Brzi unos</button>`}<button data-act="newfood" title="Nova namirnica">✏️</button></div>
  <div id="alist"></div></div>`}
function rAddList(){const el=$('#alist');if(!el)return;const q=norm(add.q);let h='';
  const rm=add.mode==='recipe';
  if(!q){const r=recentFoods(15).filter(f=>!rm||!f.rid),fav=db.foods.filter(f=>f.fav);
    if(!rm&&db.templates.length)h+=`<div class="sec">📋 Šabloni obroka</div>`+db.templates.map(t=>`<div class="fi" data-act="tpl" data-v="${t.id}"><div class="ph">📋</div><div class="grow"><div class="n">${esc(t.name)}</div><div class="xs muted">${t.items.length} stavki — dodaje se sve odjednom</div></div><div class="k">${r0(sumOf(t.items).kcal)}<div class="xs muted" style="font-weight:400">kcal</div></div></div>`).join('');
    if(!rm&&db.recipes.length)h+=`<div class="sec">📖 Moji recepti</div>`+db.recipes.map(r=>fItem(recipeFood(r),'pick')).join('');
    if(fav.length)h+=`<div class="sec">⭐ Omiljene</div>`+fav.map(f=>fItem(f,'pick')).join('');
    if(r.length)h+=`<div class="sec">🕘 Nedavno</div>`+r.map((f,i)=>fItem(Object.assign({},f,{id:'r'+i}),'pickr')).join('');
    if(!fav.length&&!r.length)h+=`<div class="empty">Ukucaj naziv namirnice ili proizvoda, ili skeniraj barkod sa ambalaže 📷</div>`;
    el.innerHTML=h;return}
  const mine=db.foods.filter(f=>norm(f.name+' '+(f.brand||'')).includes(q)).slice(0,20);
  const base=BASE.filter(f=>f._n.includes(q)).sort((a,b)=>(a._n.startsWith(q)?0:1)-(b._n.startsWith(q)?0:1)).slice(0,25);
  const mk=new Set(mine.map(fkey)),base2=base.filter(f=>!mk.has(fkey(f)));
  const recs=rm?[]:db.recipes.filter(r=>norm(r.name).includes(q));
  if(recs.length)h+=`<div class="sec">📖 Moji recepti</div>`+recs.map(r=>fItem(recipeFood(r),'pick')).join('');
  if(mine.length)h+=`<div class="sec">Moje namirnice</div>`+mine.map(f=>fItem(f,'pick')).join('');
  if(base2.length)h+=`<div class="sec">Tablica namirnica</div>`+base2.map(f=>fItem(f,'pick')).join('');
  h+=`<div class="sec">🌐 Proizvodi sa interneta (Open Food Facts)</div>`;
  if(add.busy)h+=`<div class="empty"><span class="spin"></span> Tražim…</div>`;
  else if(add.err)h+=`<div class="warnb">${esc(add.err)} <button class="btn-s" data-act="osearch">Pokušaj ponovo</button></div>`;
  else if(add.online&&add.online.q===add.q)h+=add.online.list.length?add.online.list.map(f=>fItem(f,'picko')).join(''):`<div class="empty">Nema rezultata. Probaj drugi naziv ili skeniraj barkod.</div>`;
  else h+=`<button style="width:100%" data-act="osearch">🔍 Traži „${esc(add.q)}“ na internetu</button>`;
  el.innerHTML=h}
function offTimeout(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||15000);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
function mapOff(p){const n=p.nutriments||{};const g=k=>{const v=num(n[k+'_100g']);return v==null?null:v};
  let kcal=g('energy-kcal');if(kcal==null){const kj=g('energy-kj')!=null?g('energy-kj'):g('energy');if(kj!=null)kcal=kj/4.184}
  const per={kcal:kcal==null?null:Math.round(kcal*10)/10,p:g('proteins')||0,c:g('carbohydrates')||0,f:g('fat')||0,fib:g('fiber')||0,sug:g('sugars')||0,sat:g('saturated-fat')||0,salt:g('salt')||0};
  if(per.kcal==null&&(per.p||per.c||per.f))per.kcal=Math.round(per.p*4+per.c*4+per.f*9);
  const sv=num(p.serving_quantity);
  return{id:'off:'+p.code,code:String(p.code||''),name:(p.product_name_sr||p.product_name||p.generic_name||'Proizvod '+p.code).trim(),brand:String(p.brands||'').split(',')[0].trim(),qty:p.quantity||'',per,serving:sv&&sv>0&&sv<3000?sv:null,img:p.image_front_small_url||'',ns:p.nutriscore_grade||'',src:'off',nokcal:per.kcal==null}}
async function offSearch(){if(!add.q.trim()||add.busy)return;if(!navigator.onLine){add.err='Nema interneta.';rAddList();return}
  const q=add.q,ck=norm(q).trim();let cache={};try{cache=JSON.parse(localStorage.getItem(KEY+'_offc'))||{}}catch{}
  if(cache[ck]&&Date.now()-cache[ck].t<7*864e5){add.online={q,list:cache[ck].list};add.err='';rAddList();return}
  add.busy=true;add.err='';rAddList();
  try{const base=OFF+'/cgi/search.pl?search_simple=1&action=process&json=1&page_size=30&sort_by=unique_scans_n&fields='+OFF_F+'&search_terms='+encodeURIComponent(q);
    const get=async u=>((await (await offTimeout(u)).json()).products||[]).filter(p=>p.code);
    let rs=await get(base+'&tagtype_0=countries&tag_contains_0=contains&tag_0=serbia');
    if(rs.length<8){const w=await get(base);const s=new Set(rs.map(p=>p.code));rs=rs.concat(w.filter(p=>!s.has(p.code)))}
    const list=rs.map(mapOff).filter(f=>!f.nokcal);add.online={q,list};
    cache[ck]={t:Date.now(),list};const ks=Object.keys(cache).sort((a,b)=>cache[b].t-cache[a].t);ks.slice(40).forEach(k=>delete cache[k]);try{localStorage.setItem(KEY+'_offc',JSON.stringify(cache))}catch{}}
  catch(e){add.err=e.name==='AbortError'?'Server ne odgovara (Open Food Facts je ponekad spor).':'Pretraga nije uspela — proveri internet.'}
  add.busy=false;if(add.q===q)rAddList()}

function amHtml(){const f=am.food,quick=f.quick;

  return`<div class="dh"><button class="btn-s" data-act="close2">✕</button><h2>${am.entry?'Izmeni unos':am.ritem!=null?'Izmeni sastojak':'Koliko?'}${am.mode==='diary'&&!am.entry?` <span class="muted small">· ${dlabel(am.date)}</span>`:''}</h2>${quick?'':`<button class="btn-s btn-g" data-act="fav" title="Omiljeno" style="font-size:1.2rem">${isFav(f)?'⭐':'☆'}</button>`}</div><div class="db">
  <div class="row">${f.img?`<img src="${esc(f.img)}" style="width:64px;height:64px;border-radius:12px;object-fit:cover" alt="">`:''}<div class="grow"><div class="b" style="font-size:1.05rem">${esc(f.name)}${f.ns&&/^[a-e]$/.test(f.ns)?`<span class="ns ns-${f.ns}">${f.ns.toUpperCase()}</span>`:''}</div><div class="small muted">${[f.brand,f.qty,f.code?'EAN '+f.code:'',f.src==='base'?'tablica namirnica':f.src==='off'?'Open Food Facts':f.src==='recipe'?'moj recept':''].filter(Boolean).map(esc).join(' · ')}</div></div></div>
  ${f.nokcal||f.per.kcal==null?`<div class="warnb" style="margin-top:10px">Za ovaj proizvod nema podataka o kalorijama. <button class="btn-s" data-act="editfood">Dopuni sa ambalaže</button></div>`:''}
  ${quick?'':`<label class="l" style="margin-top:14px">Količina (g / ml)</label><div class="row"><button data-act="gstep" data-v="-10">−</button><input class="fld grow" id="amg" type="number" inputmode="decimal" value="${r0(am.g)===am.g?am.g:Math.round(am.g*10)/10}" data-in="amg" style="text-align:center;font-size:1.3rem;font-weight:700"><button data-act="gstep" data-v="10">＋</button></div>
  <div class="chips" style="margin-top:8px">${qb.map(x=>`<button data-act="gset" data-v="${x[0]}">${esc(x[1])}</button>`).join('')}</div>`}

  <div class="card" style="margin-top:14px"><div class="row sp"><span class="muted">Ukupno</span><span class="big" id="amk">0</span></div><table class="nut" id="amt"></table>${quick?'':`<div class="xs muted" style="margin-top:6px">Na 100 g: ${f.per.kcal==null?'?':r0(f.per.kcal)} kcal · P ${r1(f.per.p)} · UH ${r1(f.per.c)} · M ${r1(f.per.f)} g</div>`}</div>
  <button class="btn-p" style="width:100%;padding:14px" data-act="amsave">${amBtn()}</button>
  ${am.entry||am.ritem!=null?`<button class="btn-d" style="width:100%;margin-top:8px" data-act="amdel">🗑️ ${am.ritem!=null?'Ukloni iz recepta':'Obriši unos'}</button>`:''}

function amBtn(){return am.mode==='recipe'?(am.ritem!=null?'Sačuvaj':'＋ Dodaj u recept'):am.entry?'Sačuvaj izmene':'＋ Dodaj u '+MACC[am.meal]}

  ['sat',/zasi|3aci|acuhe|zasy|satur|ngop|gesatt|nasycen|nasyc|zasyc|nasit|nase?nen|telit/],

  if('BarcodeDetector' in window){let fm=[];try{fm=await BarcodeDetector.getSupportedFormats()}catch{}
    const want=['ean_13','ean_8','upc_a','upc_e'].filter(x=>fm.includes(x));

function lastMealT(){let t=0;db.entries.forEach(e=>{if(e.t&&e.t>t&&e.t<=Date.now())t=e.t});return t}
function fastHtml(){const p=P(),H=Number(p.fastH)||16;
  if(p.fastStart){const el=Date.now()-p.fastStart,pr=Math.min(1,el/(H*3600e3)),end=new Date(p.fastStart+H*3600e3);
    return`<h3><span>⏱️ Post ${H}:${24-H}</span><span class="k">${pr>=1?'✔ završen':'još '+durTxt(end-Date.now())}</span></h3><div class="big" style="font-size:1.6rem">${durTxt(el)}</div><div class="bar" style="height:10px;margin:8px 0"><i style="width:${pr*100}%;background:${pr>=1?'var(--ok)':'var(--acc)'}"></i></div><div class="row sp small"><span class="muted">Početak ${hm(new Date(p.fastStart))} · kraj ${hm(end)}${end.getDate()!==new Date().getDate()?' (sutra)':''}</span><button class="btn-s" data-act="faststop">⏹ Završi</button></div>`}
  const lm=lastMealT();return`<h3><span>⏱️ Post ${H}:${24-H}</span></h3><div class="row sp"><span class="small muted">${lm?'Od poslednjeg obroka: <b style="color:var(--txt)">'+durTxt(Date.now()-lm)+'</b>':'Nema upisanih obroka'}</span><button class="btn-p btn-s" data-act="faststart">▶ Započni post</button></div>${lm?`<button class="btn-s btn-g" style="margin-top:6px" data-act="faststartlm">Računaj od poslednjeg obroka (${hm(new Date(lm))})</button>`:''}`}
function endFastOnMeal(date){if(P().fastStart&&date===today()){const H=Number(P().fastH)||16,done=Date.now()-P().fastStart>=H*3600e3;P().fastStart=null;setTimeout(()=>toast(done?'Post uspešno završen 🎉':'Post je prekinut obrokom'),2700)}}
setInterval(()=>{const b=$('#fastbox');if(b&&ui.tab==='dnevnik')b.innerHTML=fastHtml()},30000);

/* ---------- PODSETNICI ---------- */
function remCfg(){return Object.assign({on:false,bOn:true,b:'09:00',lOn:true,l:'14:00',dOn:true,d:'20:00',water:false,waterH:2,done:{},lastW:0,fastN:0},S().rem||{})}
async function notify(title,body,tag){try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){const r=await navigator.serviceWorker.ready;await r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'atmos',renotify:true});return}}catch{}toast(title+' — '+body)}
function remCheck(){const r=remCfg(),now=new Date(),t=today(),cur=hm(now);let ch=false;
  if(r.on){[['b','doručak'],['l','ručak'],['d','večeru']].forEach(([m,n])=>{if(!r[m+'On']||r.done[m]===t||cur<r[m])return;
      const [hh,mm]=r[m].split(':').map(Number);if(now.getHours()*60+now.getMinutes()-(hh*60+mm)>180){r.done[m]=t;ch=true;return}
      if(!db.entries.some(e=>e.date===t&&e.meal===m))notify('🍽️ Da li si upisao '+n+'?','Dodirni da upišeš obrok u Atmos Ishranu.','meal-'+m);r.done[m]=t;ch=true});
    if(r.water&&now.getHours()>=8&&now.getHours()<22&&Date.now()-(r.lastW||0)>=r.waterH*3600e3){const w=db.water.find(x=>x.id===t);if(!w||w.ml<calc().g.water){if(r.lastW)notify('💧 Vreme je za čašu vode','Danas: '+(((w&&w.ml)||0)/1000).toFixed(2).replace('.',',')+' l od '+(calc().g.water/1000).toFixed(1).replace('.',',')+' l','water')}r.lastW=Date.now();ch=true}}
  const p=P();if(p.fastOn&&p.fastStart&&Date.now()-p.fastStart>=(Number(p.fastH)||16)*3600e3&&r.fastN!==p.fastStart){r.fastN=p.fastStart;ch=true;notify('⏱️ Post je završen 🎉','Izdržao si '+(p.fastH||16)+' h. Vreme je za obrok!','fast')}
  if(ch){S().rem=r;saveLocal()}}
setInterval(remCheck,60000);

/* ---------- IZVEŠTAJ ZA DELJENJE ---------- */
function reportText(){const n=ui.prog,t=today(),c=calc(),days=Array.from({length:n},(_,i)=>addDays(t,i-n+1));
  const lg=days.filter(d=>db.entries.some(e=>e.date===d)),sum=d=>sumOf(dayEntries(d)),avg=k=>lg.length?lg.reduce((s,d)=>s+sum(d)[k],0)/lg.length:0;
  const fd=d=>{const x=new Date(d+'T12:00:00');return pad(x.getDate())+'.'+pad(x.getMonth()+1)+'.'};
  const ws=db.weights.filter(w=>w.date>=days[0]).sort((a,b)=>a.date.localeCompare(b.date));
  const wa=days.map(d=>(db.water.find(x=>x.id===d)||{}).ml||0).filter(Boolean),ak=db.activities.filter(a=>a.date>=days[0]).reduce((s,a)=>s+(Number(a.kcal)||0),0);
  const L=['📊 Atmos Ishrana — izveštaj za poslednjih '+n+' dana ('+fd(days[0])+'–'+fd(t)+new Date().getFullYear()+'.)','',
    'Upisanih dana: '+lg.length+'/'+n,'Prosečan unos: '+r0(avg('kcal'))+' kcal/dan (cilj '+r0(c.g.kcal)+' kcal)','U okviru cilja: '+lg.filter(d=>sum(d).kcal<=c.g.kcal*1.05).length+' dana',
    'Prosečno: proteini '+r0(avg('p'))+' g · ugljeni hidrati '+r0(avg('c'))+' g · masti '+r0(avg('f'))+' g','Vlakna '+r1(avg('fib'))+' g · šećeri '+r1(avg('sug'))+' g · so '+r1(avg('salt'))+' g'];
  if(ws.length)L.push('Težina: '+r1(ws[ws.length-1].kg)+' kg'+(ws.length>1?' ('+(ws[ws.length-1].kg-ws[0].kg>0?'+':'')+r1(ws[ws.length-1].kg-ws[0].kg)+' kg)':''));
  if(wa.length)L.push('Voda: prosečno '+(wa.reduce((a,b)=>a+b,0)/wa.length/1000).toFixed(1).replace('.',',')+' l/dan');
  if(ak)L.push('Aktivnost: ukupno '+r0(ak)+' kcal');
  return L.join('\n')}
async function shareReport(){const txt=reportText();try{if(navigator.share){await navigator.share({title:'Atmos Ishrana — izveštaj',text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast('Izveštaj je kopiran — nalepi ga u poruku')}catch{dl('atmos-ishrana-izvestaj-'+today()+'.txt',txt,'text/plain;charset=utf-8')}}
